<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作日清单 · 每日待办</title>
<style>
:root{
  /* 主题色由 JS 动态注入，可通过顶栏「主题」按钮切换。以下为默认护眼绿 */
  --bg:#eaf2e9; --panel:#fbfdfb; --line:#dde8dc; --text:#3a4a3f; --muted:#8ea08f;
  --accent:#5fa77f; --accent2:#8fd0b0; --accent-soft:#e2efe3;
  --topbar:linear-gradient(135deg,#8ad6b0,#3f8f6a); --barfill:linear-gradient(90deg,#7bd0a8,#4f9670);
  --hi:#e07a7a; --mid:#dcab55; --lo:#6aa88a; --shadow:0 2px 12px rgba(60,80,60,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s}
.topbar{background:var(--topbar);color:#fff;padding:16px 26px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.tb-left{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tb-left h1{font-size:19px;font-weight:700}
.tb-sub{font-size:13px;opacity:.85}
.tb-right{display:flex;align-items:center;gap:10px;font-size:13px}
.tb-date{opacity:.95;margin-right:4px}
.tb-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;
  border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer}
.tb-btn:hover{background:rgba(255,255,255,.3)}
.theme-wrap{position:relative}
.theme-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:10px;box-shadow:0 12px 34px rgba(0,0,0,.18);display:none;
  grid-template-columns:repeat(3,1fr);gap:6px;z-index:60;width:230px}
.theme-menu.show{display:grid}
.sw{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
  padding:7px 4px;border-radius:9px;border:1px solid transparent}
.sw:hover{background:var(--bg)}
.sw.on{border-color:var(--accent);background:var(--accent-soft)}
.sw .ball{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw span{font-size:11px;color:var(--text)}
.container{max-width:1440px;margin:0 auto;padding:20px;display:grid;
  grid-template-columns:300px 1fr 330px;gap:18px;align-items:start}
@media(max-width:1200px){.container{grid-template-columns:280px 1fr}.right-col{grid-column:1/-1}
  .right-col .panel{display:inline-block;width:calc(50% - 8px);vertical-align:top}
  .right-col .panel:first-child{margin-right:16px}}
@media(max-width:820px){.container{grid-template-columns:1fr}
  .right-col .panel{display:block;width:100%;margin-right:0}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:18px;box-shadow:var(--shadow)}
.left-col .panel+.panel,.right-col .panel+.panel{margin-top:16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-weight:700;font-size:15px}
.cal-nav{border:1px solid var(--line);background:#fff;width:30px;height:30px;border-radius:8px;
  cursor:pointer;color:var(--text);font-size:15px}
.cal-nav:hover{background:var(--bg)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;
  border-radius:10px;font-size:13px;cursor:pointer}
.cell:hover{background:var(--bg)}
.cell.other{color:#cfd3db}
.cell.today{background:var(--accent);color:#fff;font-weight:700}
.cell.sel:not(.today){box-shadow:inset 0 0 0 2px var(--accent)}
.cell .cdot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cell.today .cdot{background:#fff}
.mini-title,.stat-title{font-weight:700;font-size:15px}
.mini-title{margin-bottom:12px}
.mini-list{display:flex;flex-direction:column;gap:8px}
.mini-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 10px;
  background:var(--bg);border-radius:8px;border-left:3px solid var(--mid);cursor:pointer}
.mini-item.hi{border-left-color:var(--hi)}.mini-item.lo{border-left-color:var(--lo)}
.mini-item.done{opacity:.5;text-decoration:line-through}
.mini-item .mt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-item .mtime{color:var(--muted);font-size:11px}
.mini-empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0}
.main-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
  gap:12px;margin-bottom:16px}
.main-date{font-size:20px;font-weight:700}
.main-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--text)}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#4f9670}
.btn-danger{color:var(--hi);border-color:#f6d4d4}
.btn-danger:hover{background:#fdecec}
.btn-danger.armed{background:var(--hi);color:#fff;border-color:var(--hi)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;
  font-size:13px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:5px}
.chip:hover{background:var(--bg)}
.chip.active{background:var(--accent-soft);color:var(--accent);
  border-color:var(--accent-soft);font-weight:600}
.chip .cd{width:8px;height:8px;border-radius:50%}
.chip .cd.hi{background:var(--hi)}.chip .cd.mid{background:var(--mid)}.chip .cd.lo{background:var(--lo)}
.tasks{display:flex;flex-direction:column;gap:10px;min-height:200px}
.task{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--line);
  border-radius:12px;border-left-width:4px;transition:.12s}
.task.hi{border-left-color:var(--hi)}.task.mid{border-left-color:var(--mid)}.task.lo{border-left-color:var(--lo)}
.task.done{opacity:.6}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.task.selectable{cursor:pointer}
.task.selected{background:var(--accent-soft);border-color:var(--accent)}
.check{width:22px;height:22px;border:2px solid #d0d4dd;border-radius:7px;cursor:pointer;
  flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:14px;margin-top:1px}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.t-body{flex:1;min-width:0}
.t-title{font-size:15px;word-break:break-word}
.t-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.ptag{padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.ptag.hi{background:#fdecec;color:var(--hi)}.ptag.mid{background:#fef6e0;color:#c77c11}.ptag.lo{background:#e8f8ee;color:#159b45}
.tag{background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:20px;font-size:11px}
.ddl.overdue{color:var(--hi);font-weight:600}
.t-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 2px}
.t-del:hover{color:var(--hi)}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
.stat-title{margin-bottom:14px}
.stat-label{font-size:13px;color:var(--muted);margin-bottom:6px}
.rate-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar{flex:1;height:8px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--barfill);border-radius:6px;transition:.3s}
.rate-num{font-weight:700;color:var(--accent);font-size:14px}
.sub-note{font-size:12px;color:var(--muted);margin-bottom:18px}
.divider{height:1px;background:var(--line);margin:16px 0}
.trend{display:flex;align-items:flex-end;gap:8px;height:70px;margin-bottom:6px}
.trend-col{flex:1;height:100%;display:flex;align-items:flex-end}
.trend-bar{width:100%;background:var(--bg);border-radius:5px 5px 0 0;min-height:4px;
  display:flex;flex-direction:column-reverse;overflow:hidden}
.trend-bar>i{display:block;background:var(--accent)}
.trend-bar.is-today{outline:2px solid var(--accent2);outline-offset:-1px}
.trend-labels{display:flex;gap:8px}
.trend-labels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.trend-labels span.on{color:var(--accent);font-weight:700}
.stat-nums{display:flex;gap:34px;margin:12px 0 2px}
.stat-nums .n{font-size:26px;font-weight:700}
.stat-nums .n.g{color:var(--lo)}
.stat-nums small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.tags-wrap{display:flex;gap:6px;flex-wrap:wrap}
.tags-wrap .tg{background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:20px;font-size:12px}
.memo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.memo-clear{border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer}
.memo-clear:hover{color:var(--hi)}
textarea.memo{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;
  padding:12px;font:inherit;font-size:13px;resize:vertical;outline:none;background:var(--bg)}
textarea.memo:focus{border-color:var(--accent);background:#fff}
.overlay{position:fixed;inset:0;background:rgba(20,15,50,.4);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;
  box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:17px;margin-bottom:6px}
.modal label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;outline:none}
.modal input:focus,.modal textarea:focus{border-color:var(--accent)}
.modal textarea{min-height:120px;resize:vertical}
.prio-pick{display:flex;gap:8px}
.prio-pick button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:9px;font-size:13px;cursor:pointer}
.prio-pick button.on[data-p=hi]{background:#fdecec;border-color:var(--hi);color:var(--hi)}
.prio-pick button.on[data-p=mid]{background:#fef6e0;border-color:var(--mid);color:#c77c11}
.prio-pick button.on[data-p=lo]{background:#e8f8ee;border-color:var(--lo);color:#159b45}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.selbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b2d3a;
  color:#fff;padding:12px 20px;border-radius:12px;display:none;align-items:center;gap:16px;
  z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px}
.selbar.show{display:flex}
.selbar button{border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
.selbar .del{background:var(--hi);color:#fff}
.selbar .cancel{background:rgba(255,255,255,.2);color:#fff}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-16px);
  background:#2b2d3a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:80;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-left">
    <h1>📋 工作日清单</h1>
    <span class="tb-sub" id="tbSub"></span>
  </div>
  <div class="tb-right">
    <span class="tb-date" id="tbDate"></span>
    <div class="theme-wrap">
      <button class="tb-btn" id="themeBtn">🎨 主题</button>
      <div class="theme-menu" id="themeMenu"></div>
    </div>
    <button class="tb-btn" id="exportBtn">导出</button>
    <button class="tb-btn" id="importBtn">导入</button>
    <button class="tb-btn" id="toTodayBtn">回到今天</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</div>
<div class="container">
  <div class="left-col">
    <div class="panel">
      <div class="cal-head">
        <button class="cal-nav" id="prevM">‹</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="cal-nav" id="nextM">›</button>
      </div>
      <div class="grid7" id="dow"></div>
      <div class="grid7" id="cal"></div>
    </div>
    <div class="panel">
      <div class="mini-title">今日待办</div>
      <div class="mini-list" id="miniList"></div>
    </div>
  </div>
  <!-- MID_COL -->
  <div class="panel mid-col">
    <div class="main-head">
      <div class="main-date" id="mainDate"></div>
      <div class="main-actions">
        <button class="btn btn-primary" id="newBtn">＋ 新建任务</button>
        <button class="btn" id="bulkAddBtn">批量添加</button>
        <button class="btn btn-danger" id="bulkDelBtn">批量删除</button>
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="tasks" id="tasks"></div>
  </div>
  <div class="right-col">
    <div class="panel">
      <div class="stat-title">📊 数据统计</div>
      <div class="stat-label">今日完成率</div>
      <div class="rate-row"><div class="bar"><span id="rateBar"></span></div><span class="rate-num" id="rateNum">0%</span></div>
      <div class="sub-note" id="todayCount">今日 0 / 0 完成</div>
      <div class="stat-label">本周任务趋势</div>
      <div class="trend" id="trend"></div>
      <div class="trend-labels" id="trendLabels"></div>
      <div class="stat-nums">
        <div><div class="n" id="totalNum">0</div><small>本周任务</small></div>
        <div><div class="n g" id="doneNum">0</div><small>已完成</small></div>
      </div>
      <div class="divider"></div>
      <div class="stat-label">常用标签</div>
      <div class="tags-wrap" id="tagsWrap"></div>
    </div>
    <div class="panel">
      <div class="memo-head"><div class="stat-title" style="margin:0">📝 快捷备忘</div><button class="memo-clear" id="memoClear">清空</button></div>
      <textarea class="memo" id="memo" placeholder="随手记录临时想法、会议要点、待确认事项..."></textarea>
    </div>
  </div>
</div>
<div class="overlay" id="taskOverlay">
  <div class="modal">
    <h3>新建任务</h3>
    <label>任务内容</label>
    <input type="text" id="mTitle" placeholder="要做什么？" autocomplete="off">
    <label>截止时间（可选）</label>
    <input type="time" id="mTime">
    <label>优先级</label>
    <div class="prio-pick" id="prioPick">
      <button data-p="hi">🔴 高优</button>
      <button data-p="mid" class="on">🟡 中优</button>
      <button data-p="lo">🟢 低优</button>
    </div>
    <label>标签（逗号分隔，可选）</label>
    <input type="text" id="mTags" placeholder="如：会议, 报告" autocomplete="off">
    <div class="modal-actions">
      <button class="btn" id="taskCancel">取消</button>
      <button class="btn btn-primary" id="taskSave">保存</button>
    </div>
  </div>
</div>
<div class="overlay" id="bulkOverlay">
  <div class="modal">
    <h3>批量添加任务</h3>
    <label>每行一个任务（默认中优先级，加入当前选中日期）</label>
    <textarea id="bulkText" placeholder="撰写周报&#10;回复客户邮件&#10;评审设计稿"></textarea>
    <div class="modal-actions">
      <button class="btn" id="bulkCancel">取消</button>
      <button class="btn btn-primary" id="bulkSave">添加</button>
    </div>
  </div>
</div>
<div class="selbar" id="selbar">
  <span id="selCount">已选 0 项</span>
  <button class="del" id="selDelete">删除选中</button>
  <button class="cancel" id="selCancelBtn">退出</button>
</div>
<div class="toast" id="toast"></div>
<script>
// SCRIPT_BODY
const $=id=>document.getElementById(id);
const PRIO={hi:'高优',mid:'中优',lo:'低优'},PORDER={hi:0,mid:1,lo:2};
const WD=['一','二','三','四','五','六','日'];
let store=JSON.parse(localStorage.getItem('workday.tasks')||'{}');
let view=new Date(), sel=new Date(), filter='all';
let modalPrio='mid', selMode=false, selected=new Set();

const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey=key(new Date());
const saveTasks=()=>localStorage.setItem('workday.tasks',JSON.stringify(store));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dow=d=>`周${WD[(d.getDay()+6)%7]}`;
const nowHM=()=>{const n=new Date();return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;};
const dayTasks=k=>store[k]||[];
let toastTimer;
function toast(msg){
  const el=$('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function weekDays(d){
  const off=(d.getDay()+6)%7, mon=new Date(d); mon.setDate(d.getDate()-off);
  return Array.from({length:7},(_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x;});
}
function renderAll(){renderTopbar();renderCal();renderMain();renderMini();renderStats();}

function renderTopbar(){
  const t=new Date();
  $('tbDate').textContent=`${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日 ${dow(t)}`;
  const items=dayTasks(todayKey), pending=items.filter(x=>!x.done).length;
  $('tbSub').textContent=!items.length?'今日暂无任务，点击新建开始吧'
    :pending?`今日还有 ${pending} 个任务待完成`:'今日任务已全部完成 🎉';
}

$('dow').innerHTML=WD.map(d=>`<div class="dow">${d}</div>`).join('');
function renderCal(){
  $('calTitle').textContent=`${view.getFullYear()}年 ${view.getMonth()+1}月`;
  const y=view.getFullYear(),m=view.getMonth();
  const start=new Date(y,m,1); start.setDate(1-((start.getDay()+6)%7));
  let html='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=key(d), has=dayTasks(k).some(x=>!x.done);
    const cls=['cell'];
    if(d.getMonth()!==m)cls.push('other');
    if(k===todayKey)cls.push('today');
    if(k===key(sel))cls.push('sel');
    html+=`<div class="${cls.join(' ')}" data-t="${d.getTime()}">${d.getDate()}${has?'<span class="cdot"></span>':''}</div>`;
  }
  $('cal').innerHTML=html;
  document.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{
    sel=new Date(Number(c.dataset.t));
    if(sel.getMonth()!==view.getMonth()||sel.getFullYear()!==view.getFullYear())view=new Date(sel);
    exitSel();renderAll();
  });
}
// MAIN_RENDER
const FILTERS=[['all','全部',''],['todo','待完成',''],['done','已完成',''],
  ['hi','高优','hi'],['mid','中优','mid'],['lo','低优','lo']];
$('filters').innerHTML=FILTERS.map(([f,label,dot])=>
  `<div class="chip" data-f="${f}">${dot?`<span class="cd ${dot}"></span>`:''}${label}</div>`).join('');
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.f;renderMain();});

function matchFilter(t){
  if(filter==='todo')return !t.done;
  if(filter==='done')return t.done;
  if(['hi','mid','lo'].includes(filter))return t.prio===filter;
  return true;
}
function sortTasks(arr){
  return arr.slice().sort((a,b)=>a.done-b.done||PORDER[a.prio]-PORDER[b.prio]||
    (a.time||'99').localeCompare(b.time||'99'));
}
function renderMain(){
  const k=key(sel), isToday=k===todayKey;
  $('mainDate').textContent=`${k}（${dow(sel)}）`;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.f===filter));
  $('bulkDelBtn').classList.toggle('armed',selMode);
  $('bulkDelBtn').textContent=selMode?'退出批量':'批量删除';
  const items=sortTasks(dayTasks(k).filter(matchFilter));
  if(!items.length){
    $('tasks').innerHTML=`<div class="empty">${dayTasks(k).length?'当前筛选下没有任务':'暂无任务，点击「新建任务」开始吧 ✨'}</div>`;
    return;
  }
  $('tasks').innerHTML=items.map(t=>{
    const overdue=!t.done&&t.time&&isToday&&t.time<nowHM();
    const tags=(t.tags||[]).map(tg=>`<span class="tag">${esc(tg)}</span>`).join('');
    return `<div class="task ${t.prio} ${t.done?'done':''} ${selMode?'selectable':''} ${selected.has(t.id)?'selected':''}" data-id="${t.id}">
      ${selMode?'':`<div class="check" data-check="${t.id}">${t.done?'✓':''}</div>`}
      <div class="t-body">
        <div class="t-title">${esc(t.title)}</div>
        <div class="t-meta">
          <span class="ptag ${t.prio}">${PRIO[t.prio]}</span>
          ${t.time?`<span class="ddl ${overdue?'overdue':''}">⏰ ${t.time}${overdue?' 已过期':''}</span>`:''}
          ${tags}
        </div>
      </div>
      ${selMode?'':`<button class="t-del" data-del="${t.id}">✕</button>`}
    </div>`;
  }).join('');
  const box=$('tasks');
  if(selMode){
    box.querySelectorAll('.task').forEach(el=>el.onclick=()=>{
      const id=el.dataset.id;
      selected.has(id)?selected.delete(id):selected.add(id);
      renderMain();updateSelbar();
    });
  }else{
    box.querySelectorAll('[data-check]').forEach(c=>c.onclick=()=>toggle(c.dataset.check));
    box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeTask(b.dataset.del));
  }
}
function renderMini(){
  const items=sortTasks(dayTasks(todayKey));
  $('miniList').innerHTML=items.length?items.map(t=>
    `<div class="mini-item ${t.prio} ${t.done?'done':''}" data-check="mini-${t.id}">
      <span>${t.done?'✓':'○'}</span><span class="mt">${esc(t.title)}</span>
      ${t.time?`<span class="mtime">${t.time}</span>`:''}</div>`).join('')
    :'<div class="mini-empty">今天还没有任务</div>';
  document.querySelectorAll('[data-check^="mini-"]').forEach(el=>el.onclick=()=>{
    toggleFor(todayKey,el.dataset.check.slice(5));
  });
}
// STATS_RENDER
function renderStats(){
  const today=dayTasks(todayKey), tDone=today.filter(x=>x.done).length;
  const rate=today.length?Math.round(tDone/today.length*100):0;
  $('rateBar').style.width=rate+'%';
  $('rateNum').textContent=rate+'%';
  $('todayCount').textContent=`今日 ${tDone} / ${today.length} 完成`;

  const week=weekDays(sel);
  const counts=week.map(d=>{const a=dayTasks(key(d));return {total:a.length,done:a.filter(x=>x.done).length};});
  const max=Math.max(1,...counts.map(c=>c.total));
  $('trend').innerHTML=counts.map((c,i)=>{
    const h=c.total?Math.max(8,Math.round(c.total/max*100)):4;
    const dh=c.total?Math.round(c.done/c.total*100):0;
    const isT=key(week[i])===todayKey;
    return `<div class="trend-col"><div class="trend-bar ${isT?'is-today':''}" style="height:${h}%"><i style="height:${dh}%"></i></div></div>`;
  }).join('');
  $('trendLabels').innerHTML=week.map((d,i)=>
    `<span class="${key(d)===todayKey?'on':''}">${WD[i]}</span>`).join('');

  const wTotal=counts.reduce((s,c)=>s+c.total,0), wDone=counts.reduce((s,c)=>s+c.done,0);
  $('totalNum').textContent=wTotal;
  $('doneNum').textContent=wDone;

  const tagCount={};
  Object.values(store).flat().forEach(t=>(t.tags||[]).forEach(tg=>tagCount[tg]=(tagCount[tg]||0)+1));
  const top=Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  $('tagsWrap').innerHTML=top.length
    ?top.map(([tg,n])=>`<span class="tg">${esc(tg)} ${n}</span>`).join('')
    :'<span style="color:var(--muted);font-size:13px">暂无标签</span>';
}
// ACTIONS
function toggleFor(k,id){
  (store[k]||[]).forEach(t=>{if(t.id===id)t.done=!t.done;});
  saveTasks();renderAll();
}
function toggle(id){toggleFor(key(sel),id);}
function removeTask(id){
  const k=key(sel);
  store[k]=(store[k]||[]).filter(t=>t.id!==id);
  if(!store[k].length)delete store[k];
  saveTasks();renderAll();
}
function addTask(k,title,time,prio,tags){
  (store[k]=store[k]||[]).push({
    id:String(Date.now())+Math.floor(Math.random()*1e4),
    title,time:time||'',prio,tags:tags||[],done:false
  });
}
// new task modal
$('newBtn').onclick=()=>{
  $('mTitle').value='';$('mTime').value='';$('mTags').value='';setPrio('mid');
  $('taskOverlay').classList.add('show');$('mTitle').focus();
};
$('prioPick').querySelectorAll('button').forEach(b=>b.onclick=()=>setPrio(b.dataset.p));
function setPrio(p){modalPrio=p;$('prioPick').querySelectorAll('button')
  .forEach(b=>b.classList.toggle('on',b.dataset.p===p));}
$('taskCancel').onclick=()=>$('taskOverlay').classList.remove('show');
$('taskSave').onclick=()=>{
  const title=$('mTitle').value.trim();
  if(!title){$('mTitle').focus();return;}
  const tags=$('mTags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  addTask(key(sel),title,$('mTime').value,modalPrio,tags);
  saveTasks();$('taskOverlay').classList.remove('show');renderAll();
};
$('mTitle').addEventListener('keydown',e=>{if(e.key==='Enter')$('taskSave').click();});
// bulk add
$('bulkAddBtn').onclick=()=>{$('bulkText').value='';$('bulkOverlay').classList.add('show');$('bulkText').focus();};
$('bulkCancel').onclick=()=>$('bulkOverlay').classList.remove('show');
$('bulkSave').onclick=()=>{
  const lines=$('bulkText').value.split('\n').map(s=>s.trim()).filter(Boolean);
  lines.forEach(l=>addTask(key(sel),l,'','mid',[]));
  if(lines.length)saveTasks();
  $('bulkOverlay').classList.remove('show');renderAll();
};
// batch delete (selection mode)
$('bulkDelBtn').onclick=()=>{selMode?exitSel():enterSel();};
function enterSel(){selMode=true;selected.clear();renderMain();updateSelbar();}
function exitSel(){selMode=false;selected.clear();$('selbar').classList.remove('show');renderMain();}
function updateSelbar(){
  $('selbar').classList.toggle('show',selMode);
  $('selCount').textContent=`已选 ${selected.size} 项`;
}
$('selCancelBtn').onclick=exitSel;
$('selDelete').onclick=()=>{
  if(!selected.size){exitSel();return;}
  const k=key(sel);
  store[k]=(store[k]||[]).filter(t=>!selected.has(t.id));
  if(!store[k].length)delete store[k];
  saveTasks();exitSel();renderAll();
};
// close overlay on backdrop click
document.querySelectorAll('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)o.classList.remove('show');});
// MEMO_AND_IO
$('memo').value=localStorage.getItem('workday.memo')||'';
$('memo').addEventListener('input',()=>localStorage.setItem('workday.memo',$('memo').value));
$('memoClear').onclick=()=>{
  if($('memo').value&&!confirm('确定清空备忘？'))return;
  $('memo').value='';localStorage.setItem('workday.memo','');
};
// export / import
function doExport(auto){
  const data={tasks:store,memo:$('memo').value,exportedAt:new Date().toISOString(),version:1};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const tag=auto?'周备份':'手动';
  a.download=`工作日清单_${tag}_${key(new Date())}.json`;
  a.click();URL.revokeObjectURL(a.href);
}
$('exportBtn').onclick=()=>{doExport(false);toast('数据已导出 📤');};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(data.tasks&&typeof data.tasks==='object'){
        store=data.tasks;saveTasks();
        if(typeof data.memo==='string'){$('memo').value=data.memo;localStorage.setItem('workday.memo',data.memo);}
        renderAll();alert('导入成功');
      }else alert('文件格式不正确');
    }catch(err){alert('解析失败：'+err.message);}
    $('importFile').value='';
  };
  r.readAsText(f);
};
// month nav & today
$('prevM').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal();};
$('nextM').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal();};
$('toTodayBtn').onclick=()=>{view=new Date();sel=new Date();exitSel();renderAll();};
// esc to close modals
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show'));
});
// theme switcher — 单色炫酷渐变
const THEMES=[
  {id:'green',name:'护眼绿',v:{'--bg':'#eaf2e9','--panel':'#fbfdfb','--line':'#dde8dc','--text':'#33413a','--muted':'#8ea08f','--accent':'#4f9670','--accent2':'#8fd0b0','--accent-soft':'#e2efe3','--topbar':'linear-gradient(135deg,#8ad6b0,#3f8f6a)','--barfill':'linear-gradient(90deg,#7bd0a8,#4f9670)'}},
  {id:'teal',name:'青碧',v:{'--bg':'#e7f3f2','--panel':'#fbfefe','--line':'#d6e8e6','--text':'#294541','--muted':'#82a09c','--accent':'#199e92','--accent2':'#7fd6cc','--accent-soft':'#daf0ed','--topbar':'linear-gradient(135deg,#4fd6c4,#127f74)','--barfill':'linear-gradient(90deg,#3ecabb,#178f82)'}},
  {id:'blue',name:'深海蓝',v:{'--bg':'#eef2fb','--panel':'#fcfdff','--line':'#dde5f4','--text':'#2a344b','--muted':'#8b95ac','--accent':'#2f6fe0','--accent2':'#8fb4ff','--accent-soft':'#e4ecfd','--topbar':'linear-gradient(135deg,#6aa8ff,#2b5fd0)','--barfill':'linear-gradient(90deg,#5c9bff,#2b5fd0)'}},
  {id:'purple',name:'魅紫',v:{'--bg':'#f1ecfb','--panel':'#fdfcff','--line':'#e6ddf4','--text':'#38304b','--muted':'#998fac','--accent':'#7c4fe0','--accent2':'#b795ff','--accent-soft':'#ece2fd','--topbar':'linear-gradient(135deg,#b18bff,#6d3fd8)','--barfill':'linear-gradient(90deg,#a074ff,#6d3fd8)'}},
  {id:'pink',name:'蜜桃粉',v:{'--bg':'#fbecf1','--panel':'#fffcfd','--line':'#f4dde5','--text':'#4b3038','--muted':'#ac8f98','--accent':'#d85585','--accent2':'#ffa6c4','--accent-soft':'#fbe0e9','--topbar':'linear-gradient(135deg,#ff9dbf,#d14e7d)','--barfill':'linear-gradient(90deg,#ff8db4,#d14e7d)'}},
  {id:'orange',name:'日落橙',v:{'--bg':'#fbf0e8','--panel':'#fffdfb','--line':'#f4e2d3','--text':'#4b3a2e','--muted':'#ac988a','--accent':'#e2662a','--accent2':'#ffb06a','--accent-soft':'#fde8d8','--topbar':'linear-gradient(135deg,#ffb06a,#e2662a)','--barfill':'linear-gradient(90deg,#ff9d4d,#e2662a)'}},
  {id:'ink',name:'极客黑',v:{'--bg':'#eceef3','--panel':'#ffffff','--line':'#dfe2ea','--text':'#20242e','--muted':'#8a90a0','--accent':'#3d4457','--accent2':'#8a93b0','--accent-soft':'#e6e8ef','--topbar':'linear-gradient(135deg,#4a5578,#20242e)','--barfill':'linear-gradient(90deg,#5a6488,#2b3040)'}}
];
let themeId=localStorage.getItem('workday.theme')||'green';
function applyTheme(id){
  const t=THEMES.find(x=>x.id===id)||THEMES[0];
  themeId=t.id;
  Object.entries(t.v).forEach(([k,val])=>document.documentElement.style.setProperty(k,val));
  localStorage.setItem('workday.theme',t.id);
  $('themeMenu').innerHTML=THEMES.map(x=>
    `<div class="sw ${x.id===themeId?'on':''}" data-theme="${x.id}">
      <span class="ball" style="background:${x.v['--topbar']}"></span>
      <span>${x.name}</span></div>`).join('');
  $('themeMenu').querySelectorAll('[data-theme]').forEach(el=>el.onclick=()=>{
    applyTheme(el.dataset.theme);$('themeMenu').classList.remove('show');
  });
}
$('themeBtn').onclick=e=>{e.stopPropagation();$('themeMenu').classList.toggle('show');};
document.addEventListener('click',e=>{
  if(e.target!==$('themeBtn')&&!$('themeMenu').contains(e.target))$('themeMenu').classList.remove('show');
});
applyTheme(themeId);
// 每周自动导出：距上次备份满 7 天且有数据时，自动下载一份 JSON
function weeklyAutoExport(){
  const AK='workday.lastAutoExport', WEEK=7*24*3600*1000, now=Date.now();
  const last=Number(localStorage.getItem(AK)||0);
  if(!last){localStorage.setItem(AK,String(now));return;}      // 首次访问只记录时间
  if(Object.keys(store).length && now-last>=WEEK){
    doExport(true);
    localStorage.setItem(AK,String(now));
    toast('已自动完成每周数据备份 📦');
  }
}
renderAll();
weeklyAutoExport();
</script>
